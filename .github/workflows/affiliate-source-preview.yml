name: Affiliate-Quellen prüfen – nur Vorschau
on:
  push:
    branches: ['preview/affiliate-video-2026-11-21']
    paths: ['scripts/check-affiliate-sources.py', '.github/workflows/affiliate-source-preview.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4==4.14.2
      - run: python scripts/check-affiliate-sources.py
      - run: |
          git config user.name 'VPM Preview Checks'
          git config user.email 'preview@users.noreply.github.com'
          git add docs/AFFILIATE-QUELLEN-PRUEFUNG.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record read-only affiliate source verification'
          git push origin HEAD:preview/affiliate-video-2026-11-21
