name: Valet-Video – flüssigere Sprecherfassung (nur Vorschau)
on:
  workflow_dispatch:
  push:
    branches: ['preview/affiliate-video-2026-11-21']
    paths: ['scripts/build-video-speech-natural.py', '.github/workflows/valet-video-natural-speech.yml']
permissions:
  contents: write
jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg sox
      - run: python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install qwen-tts==0.1.1 faster-whisper==1.2.1
      - run: python -u scripts/build-video-speech-natural.py
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '4'
      - name: Nur Audiodateien im Vorschauzweig sichern – kein Deployment
        run: |
          git config user.name 'VPM Video Preview'
          git config user.email 'video-preview@users.noreply.github.com'
          git add media/valet-erklaervideo/sprecher-maennlich.wav media/valet-erklaervideo/projekt/sprechpruefung.json media/valet-erklaervideo/projekt/STIMMENMODELL-LIZENZ.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Render continuous natural German male narration'
          git push origin HEAD:preview/affiliate-video-2026-11-21
