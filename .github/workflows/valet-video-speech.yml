name: Valet-Video – männliche Sprecherstimme (nur Vorschau)
on:
  workflow_dispatch:
  push:
    branches: ['preview/affiliate-video-2026-11-21']
    paths: ['scripts/build-video-speech.py', 'media/valet-erklaervideo/sprechertext.txt', 'media/valet-erklaervideo/projekt/sprechsegmente.json', '.github/workflows/valet-video-speech.yml']
permissions:
  contents: write
jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install piper-tts==1.3.0 numpy==2.2.6
      - run: python scripts/build-video-speech.py
      - name: Nur Sprecherdateien im Vorschauzweig speichern – kein Deployment
        run: |
          git config user.name 'VPM Video Preview'
          git config user.email 'video-preview@users.noreply.github.com'
          git add media/valet-erklaervideo/sprecher-maennlich.wav media/valet-erklaervideo/projekt/sprachzeiten.json media/valet-erklaervideo/projekt/STIMMENMODELL-LIZENZ.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Render approved German male video narration'
          git push origin HEAD:preview/affiliate-video-2026-11-21
