name: Valet-Video – nur Einstieg und Abschluss korrigieren
on:
  push:
    branches: ['preview/affiliate-video-2026-11-21']
    paths: ['scripts/patch-video-speech-ends.py', '.github/workflows/valet-video-speech-ends.yml']
permissions:
  contents: write
jobs:
  endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg sox
      - run: python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install qwen-tts==0.1.1 faster-whisper==1.2.1
      - run: python -u scripts/patch-video-speech-ends.py
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '4'
      - name: Nur Audiokorrektur speichern – kein Deployment
        run: |
          git config user.name 'VPM Video Preview'
          git config user.email 'video-preview@users.noreply.github.com'
          git add media/valet-erklaervideo/sprecher-maennlich.wav media/valet-erklaervideo/projekt/sprechpruefung.json media/valet-erklaervideo/projekt/endpunkt-korrektur.json media/valet-erklaervideo/projekt/sprecher-einstieg-korrigiert.wav media/valet-erklaervideo/projekt/sprecher-abschluss-korrigiert.wav
          git diff --cached --quiet && exit 0
          git commit -m 'Refine narration endpoints while preserving the approved middle waveform'
          git push origin HEAD:preview/affiliate-video-2026-11-21
